<div class="job-postings-container">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h2>Job Postings</h2>
      <button class="btn btn-primary">Post New Job</button>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Title</th>
              <th>Location</th>
              <th>Type</th>
              <th>Posted Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let job of jobPostings">
              <td>{{ job.title }}</td>
              <td>{{ job.location }}</td>
              <td>{{ job.jobType | titlecase }}</td>
              <td>{{ job.createdAt | date:'shortDate' }}</td>
              <td>
                <span class="badge" [ngClass]="{'bg-success': job.isActive, 'bg-danger': !job.isActive}">
                  {{ job.isActive ? 'Active' : 'Inactive' }}
                </span>
              </td>
              <td>
                <div class="btn-group">
                  <button class="btn btn-sm btn-outline-primary">Edit</button>
                  <button class="btn btn-sm btn-outline-secondary" (click)="toggleJobStatus(job)">
                    {{ job.isActive ? 'Deactivate' : 'Activate' }}
                  </button>
                  <button class="btn btn-sm btn-outline-danger" (click)="deleteJob(job.id!)">Delete</button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <div *ngIf="jobPostings.length === 0" class="text-center p-4">
        <p>No job postings found.</p>
        <button class="btn btn-primary">Create Your First Job Posting</button>
      </div>
    </div>
  </div>
</div>
